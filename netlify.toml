[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  # Enable Next.js Image Optimization on Netlify
  NEXT_PUBLIC_NETLIFY = "true"

[functions]
  node_bundler = "esbuild"

[functions."*"]
  timeout = 15

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# O cardapio em PDF nao pode herdar o "immutable" de /images/*: o arquivo e
# substituido a cada cardapio novo e quem ja baixou uma vez ficaria preso na
# versao antiga por um ano. Revalida a cada visita (304 quando nao mudou).
[[headers]]
  for = "/images/Cardapio-2026.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Links antigos (e o PDF que ficou cacheado como immutable nos navegadores)
# continuam funcionando e passam a apontar para o cardapio atual.
[[redirects]]
  from = "/images/Cardapio.pdf"
  to = "/images/Cardapio-2026.pdf"
  status = 301
  force = true

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/chunks/*.css"
  [headers.values]
    Content-Type = "text/css"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/css/*.css"
  [headers.values]
    Content-Type = "text/css"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"